# Stage F: Taraguchi-10 opening RL + league (TRAINING.md §2.5-§2.6, Phase 7).
# Continues from the Phase 6 best model. Self-play starts from the empty board or from random
# opening prefixes and records every opening decision (swap / branch / ten proposals / selection).
# Initial values; revise from measurements.
run_name: taraguchi_v1
run_dir: runs
seed: 7
device: auto
amp_bf16: true
init_checkpoint: runs/selfplay_v2/models/gen_003.pt
generations: 3
regret_positions: 20
selfplay:
  games: 256
  sims_full: 64
  sims_fast: 16
  p_full: 0.75
  root: GUMBEL
  gumbel_m: 16
  root_tactics_nodes: 2000
  max_inflight: 8
  max_plies: 225
  profile: OMOKDOJANG_DAN
  start: mixed            # empty board or a random opening prefix
  prefix_prob: 0.5
  record_opening: true
  league_fraction: 0.25   # share of games vs the league pool (PFSP)
  opponent_sims: 32
league:
  pfsp_eps: 0.05
  past_best: 2            # most recent previous best models of this run
  fixed:
    - {name: heuristic, spec: heuristic}
    - {name: stage_b_v0, spec: "engine:runs/stage_b_b6c64_v1/checkpoints/step_6000.pt"}
    - {name: selfplay_v2_best, spec: "engine:runs/selfplay_v2/models/gen_003.pt"}
replay:
  window: 4
  capacity: 200000
train:
  steps_per_generation: 150
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  grad_clip: 5.0
  tactical_mix: 0.25
  tactical_data: data/stage_a_v1
  loss: {policy: 1.0, value: 1.0, aux: 0.5, opening: 1.0}
eval:
  openings: prefix        # engines make the remaining opening decisions themselves
  sims: 64
  pairs_per_round: 20
  min_pairs: 20
  max_pairs: 80
  elo0: 0
  elo1: 30
  alpha: 0.05
  beta: 0.05
  anchor_pairs: 20
