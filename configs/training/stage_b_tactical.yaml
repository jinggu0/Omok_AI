# Stage B: supervised tactical pretraining on Stage A solver labels (TRAINING.md §2.2).
# All numbers are initial guesses to be revised from measurements (TRAINING.md §10).
run_name: stage_b_b6c64_v1
run_dir: runs
seed: 1
device: auto            # xpu if available, else cpu
deterministic: false
amp_bf16: true          # XPU only (ADR-04); ignored on CPU
data:
  dir: data/stage_a_v1
  holdout_pct: 5.0
  augment: true         # random D4 transform per sample (C++ transform table)
  exclude_benchmarks: true
features:
  history_planes: 0
  tactical_planes: false   # ablation E (off = pure learned features + aux supervision)
  forbidden_plane: true
model:
  blocks: 6
  channels: 64
  head_hidden: 128
loss:
  policy: 1.0
  value: 1.0
  aux: 0.5
optim:
  lr: 0.002
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  warmup_steps: 300
  total_steps: 6000
  batch_size: 256
  grad_clip: 5.0
log_every: 100
eval_every: 1000
checkpoint_every: 2000
